<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>ENQUIRY</title>
    <link rel="stylesheet" href="CSS/style.css">
</head>
<body>
    <header>
        <img src="IMAGES/studioo.png" alt="Radiance Studio Logo" class="logo">
        <nav>
            <a href="home page.html">home</a>
            <a href="about us.html">about us</a>
            <a href="services.html">service</a>
            <a href="gallery.html">gallery</a>
            <a href="enquiry.html" aria-current="page">enquiry</a>
            <a href="contact.html">contact</a>
        </nav>
    </header>

    <div class="hero-intro">
        <h1>Radiance Studio</h1>
        <p class="tagline">Keeping the Radiance of Your Hair</p>
    </div>

    <main>

        <section id="enquiry-intro">
            <h2>Service Enquiry</h2>
            <p>
                Interested in one of our services? Fill in the form below and one of our stylists
                will get back to you with availability and pricing tailored to your hair.
            </p>
        </section>

        <section id="enquiry-form">
            <form action="#" method="post">
                <label for="ename">Full Name</label>
                <input type="text" id="ename" name="ename" required>

                <label for="eemail">Email Address</label>
                <input type="email" id="eemail" name="eemail" required>

                <label for="ephone">Phone Number</label>
                <input type="tel" id="ephone" name="ephone" required>

                <label for="service">Service Interested In</label>
                <select id="service" name="service" required>
                    <option value="">-- Select a service --</option>
                    <option value="haircut">Haircut &amp; Styling</option>
                    <option value="colour">Colouring</option>
                    <option value="treatment">Hair Treatment</option>
                    <option value="extensions">Extensions</option>
                    <option value="bridal">Bridal Hair</option>
                    <option value="other">Other</option>
                </select>

                <label for="date">Preferred Date</label>
                <input type="date" id="date" name="date">

                <label for="location">Preferred Location</label>
                <select id="location" name="location">
                    <option value="sandton">Sandton Studio</option>
                    <option value="rosebank">Rosebank Studio</option>
                </select>

                <label for="emessage">Additional Details</label>
                <textarea id="emessage" name="emessage" rows="5" placeholder="Tell us more about what you're looking for..."></textarea>

                <button type="submit">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>&copy;ST10524275</footer>
</body>
</html>
